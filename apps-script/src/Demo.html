  function demoPad(n) { return String(n).padStart(2, '0'); }

  // Local-time stamp in the same shape the sheet rows use: YYYY-MM-DDTHH:MM:SS
  function demoStamp(d) {
    return `${d.getFullYear()}-${demoPad(d.getMonth() + 1)}-${demoPad(d.getDate())}` +
           `T${demoPad(d.getHours())}:${demoPad(d.getMinutes())}:${demoPad(d.getSeconds())}`;
  }

    const d = new Date();
    d.setDate(d.getDate() - days);

  // ── Store ──────────────────────────────────────────────────

  function demoBuildFlag(s, index, when) {
    const at      = when || demoAgo(s.days, s.h, s.m);
    const stamp   = demoStamp(at);
    const dateKey = stamp.substring(0, 10).replace(/-/g, '');
    const autoCleared = !!(s.aiShown && s.ai && s.ai.severity === 'Likely False Positive');
    const reviewedBy  = s.reviewedBy || (autoCleared ? 'AI Auto-Review' : '');
    let notes = '';
    if (s.reviewedBy)   notes = s.notes || '';
    else if (s.aiShown) notes = `AI (${s.ai.severity}): ${s.ai.assessment} — ${s.ai.reasoning}`;
    const alertSent = s.severity === 'Critical' || s.severity === 'High';
    return {
      flagId:         `FLAG-${dateKey}-${demoPad(index + 1)}`,
      exportId:       `EXP-${dateKey}-${demoPad(index + 1)}`,
      userEmail:      demoEmail(s.user),
      ouPath:         s.grade,
      timestamp:      stamp,
      queryText:      s.text,
      category:       s.category,
      matchedKeyword: s.keyword,
      severity:       s.severity,
      alertSent:      alertSent ? 'TRUE' : 'FALSE',
      alertSentAt:    alertSent ? demoStamp(new Date(at.getTime() + 21 * 60000)) : '',
      reviewed:       reviewedBy ? 'TRUE' : 'FALSE',
      reviewedBy:     reviewedBy,
      notes:          notes,
      _ai:            s.ai,
    };
  }

  function demoBuildRuns() {
    const runs = [];
    for (let days = 9; days >= 0; days--) {
      const start = demoAgo(days, 6, 0);
      const end   = new Date(start.getTime() + (3 + Math.floor(Math.random() * 4)) * 60000);
      const key   = demoStamp(start).substring(0, 10).replace(/-/g, '');
      const failed  = days === 4;
      const catchUp = days === 3;
      const imported = failed ? 0 : (catchUp ? 2610 : 1100 + Math.floor(Math.random() * 800));
      const flagged  = failed ? 0 : (catchUp ? 5 : Math.floor(Math.random() * 4));
      const alerted  = Math.floor(flagged * 0.6);
      runs.push({
        runId:       `RUN-${key}-0600`,
        startedAt:   demoStamp(start),
        completedAt: demoStamp(end),
        status:      failed ? 'FAILED' : 'SUCCESS',
        imported, flagged, alerted,
        error:       failed ? 'Vault export EXPORT-3f9a1c did not finish within the polling window; collected on the next run' : '',
      });
    }
    return runs; // oldest first, like the sheet
  }

  // ── Fake server ────────────────────────────────────────────

  const DEMO_SEVERITY_ORDER = { Critical: 0, High: 1, Medium: 2, Low: 3 };

  function demoIsUnreviewed(f) { return f.reviewed !== 'TRUE' && f.reviewed !== true; }

  function demoFindFlag(flagId) { return demoDB.flags.find(f => f.flagId === flagId); }

  function demoPublicFlag(f) { const { _ai, ...rest } = f; return rest; }

  function demoCompletePendingRun() {
    const now   = new Date();
    const key   = demoStamp(now).substring(0, 10).replace(/-/g, '');
    const start = new Date(now.getTime() - 9000);
    demoDB.runCount++;
    const fresh = DEMO_NEW_FLAG_SAMPLES.map((s, i) =>
      demoBuildFlag(s, demoDB.flags.length + i, new Date(now.getTime() - (i + 1) * 47 * 60000)));
    // Ids that cannot collide with earlier runs.
    fresh.forEach((f, i) => { f.flagId = `FLAG-${key}-R${demoDB.runCount}${demoPad(i + 1)}`; });
    demoDB.flags.push(...fresh);
    demoDB.runs.push({
      runId:       `RUN-${key}-${demoPad(now.getHours())}${demoPad(now.getMinutes())}`,
      startedAt:   demoStamp(start),
      completedAt: demoStamp(now),
      status:      'SUCCESS',
      imported:    180 + Math.floor(Math.random() * 80),
      flagged:     fresh.length,
      alerted:     fresh.filter(f => f.alertSent === 'TRUE').length,
      error:       '',
    });
    demoDB.pendingUntil = 0;
  }

  function demoNextRun() {
    const s = demoDB.settings;
    if (s.status === 'Paused') return 'Paused';
    if (s.frequency === 'hourly') return 'Within the hour';
    const now = new Date();
    const nowHM = `${demoPad(now.getHours())}:${demoPad(now.getMinutes())}`;
    if (s.frequency === 'weekly') return `${s.importDay} ${s.importTime}`;
    return (nowHM < s.importTime ? 'Today ' : 'Tomorrow ') + s.importTime;
  }

  const DEMO_API = {
    getDashboardData() {
      const runs  = demoDB.runs;
      const flags = demoDB.flags.slice()

        totals: {
          all:        flags.length,
          unreviewed: flags.filter(demoIsUnreviewed).length,

        flags:  flags.slice(0, 300).map(demoPublicFlag),

      if (!f) return { success: false, error: 'Flag ID not found' };
      f.reviewed   = 'TRUE';
      f.reviewedBy = demoWho();
      f.notes      = notes || '';
      return { success: true };
    },

        flagId: f.flagId, userEmail: f.userEmail, ouPath: f.ouPath, timestamp: f.timestamp,

        alertSent: f.alertSent, alertSentAt: f.alertSentAt, notes: f.notes,
      }));
    },

    applyAIReview(flagId, severity, assessment, reasoning) {
      const f = demoFindFlag(flagId);
      if (!f) return { success: false };
      if (severity === 'Likely False Positive') {
        f.reviewed   = 'TRUE';
        f.reviewedBy = 'AI Auto-Review';
      }
      f.notes = `AI (${severity}): ${assessment} — ${reasoning}`;
      return { success: true };
    },

    reviewFlagWithAI(flagId) {
      const f  = demoFindFlag(flagId);
      const ai = (f && f._ai) || {
        severity: 'Needs Review', assessment: 'Not enough context to decide.', reasoning: 'Review manually.',
      };
      return { flagId, ...ai };
    },

    suggestAlertCriteria() { return DEMO_CRITERIA.map(c => ({ ...c })); },
    applyAlertCriteria(categories) { return { success: true, added: (categories || []).length }; },

    getSettingsData() {
      return { ...demoDB.settings, selectedOUs: demoDB.settings.selectedOUs.slice(), ous: DEMO_OUS };
    },
    saveSettings(data) {
      if (!data) throw new Error('No settings data received. Please try again.');
      Object.assign(demoDB.settings, data, { selectedOUs: (data.selectedOUs || []).slice() });
      return { success: true };
    },

    getAccessList() { return demoDB.access.map(u => ({ ...u })); },
    addAccessUser(email, role) {
      if (!email || !email.includes('@')) throw new Error('Invalid email address');
      const lc = email.trim().toLowerCase();
      if (demoDB.access.some(u => u.email.toLowerCase() === lc)) return { success: false, error: 'User already has access' };
      demoDB.access.push({ email: email.trim(), role: role || 'Viewer', addedBy: demoWho(), addedAt: demoStamp(new Date()).replace('T', ' ') });
      return { success: true };
    },
    removeAccessUser(email) {
      const lc = String(email).trim().toLowerCase();
      const i  = demoDB.access.findIndex(u => u.email.toLowerCase() === lc);
      if (i < 0) return { success: false, error: 'User not found' };
      demoDB.access.splice(i, 1);
      return { success: true };
    },
    updateAccessRole(email, newRole) {
      const u = demoDB.access.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase());
      if (!u) return { success: false, error: 'User not found' };
      u.role = newRole;
      return { success: true };
    },
  };

  // How long each fake call takes, so the UI's spinners and states still show.
  function demoLatency(name) {
    switch (name) {
      case 'getPendingExportStatus': return 120;
      case 'reviewFlagWithAI':       return 1400;
      case 'suggestAlertCriteria':   return 1800;
      case 'runPipelineNow':         return 1600;
      default:                       return 300 + Math.floor(Math.random() * 300);
    }
  }

  // Mimics google.script.run: withSuccessHandler / withFailureHandler, then a call.
  function demoRunner() {
    if (!demoDB) resetDemoData();
    let onOk   = () => {};
    let onFail = err => console.error('Demo mode:', err);
    const chain = {
      withSuccessHandler(fn) { onOk = fn;   return proxy; },
      withFailureHandler(fn) { onFail = fn; return proxy; },
      withUserObject()       { return proxy; },
    };
    const proxy = new Proxy(chain, {
      get(target, name) {
        if (name in target) return target[name];
        return (...args) => {
          setTimeout(() => {
            const impl = DEMO_API[name];
            if (!impl) { onFail(new Error(`Demo mode has no sample for ${String(name)}.`)); return; }
            let result;
            try { result = impl(...args); } catch (e) { onFail(e); return; }
            onOk(result);
          }, demoLatency(name));
        };
      },
    });
    return proxy;
  }
